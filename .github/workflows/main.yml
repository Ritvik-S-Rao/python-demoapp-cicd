name: python app ci cd

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download a copy of your code onto the GitHub runner
      - name: Checkout repository code
        uses: actions/checkout@v4

      #Step 2: Download and install python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      #Step 3: install and run pytest for unit test
      - name: installing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r src/requirements.txt
          pytest -v

      #Step 3: Login into dockerhub and build and push docker image
      - name: Docker Hub Authentication
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ritviksrao/python-demoapp-cicd:latest

      #Step 4: Scanning for Vulnerabilities in docker image
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'ritviksrao/python-demoapp-cicd:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      #Step 5: SSH into the ec2 machine and run the updated docker image delete old app
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            docker pull ritviksrao/python-demoapp-cicd:latest
            docker stop python-app || true
            docker rm python-app || true
            docker run -d -p 5000:5000 --name python-app ritviksrao/python-demoapp-cicd:latest
